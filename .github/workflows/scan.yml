name: Scheduled job scan

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Safely scan live sources without AI calls or job Issue creation"
        type: boolean
        required: true
        default: true
  schedule:
    - cron: "17 2 * * 1-5"

concurrency:
  group: job-searcher-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || '' }}
      AI_MODEL: ${{ vars.AI_MODEL || '' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install runtime dependencies
        run: python -m pip install .
      - name: Validate configuration
        run: job-searcher --config config.yml --check-config
      - name: Restore recent report snapshots for weekly digest
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: reports/
          key: job-search-reports-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            job-search-reports-
      - name: Run safe live-source dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: job-searcher --config config.yml --output-dir reports --dry-run
      - name: Run scheduled or explicitly enabled live scan
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: job-searcher --config config.yml --output-dir reports
      - name: Save recent report snapshots
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: reports/
          key: job-search-reports-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload reports (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-search-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Open or update scan-health alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- job-searcher-scan-health-alert -->';
            const title = '[Job Searcher] Scheduled scan needs attention';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && (issue.body || '').includes(marker));
            const body = [
              marker,
              'The scheduled job search failed, no source succeeded, AI matching was incomplete, or GitHub notification delivery failed.',
              '',
              '- Workflow run: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId,
              '- Trigger: ' + context.eventName,
              '- Branch: ' + context.ref,
              '',
              'Review the run logs and uploaded report artifacts. Confirm source URLs, rate limits, provider credentials, and GitHub permissions before rerunning.',
              '',
              'This alert is updated in place to avoid creating one issue per failed run.'
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Resolve scan-health alert after a successful scan
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- job-searcher-scan-health-alert -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && (issue.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed',
                body: (existing.body || '') + '\n\nResolved by successful workflow run: ' +
                  context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId
              });
            }
