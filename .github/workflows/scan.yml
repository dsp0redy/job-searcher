name: Scheduled job scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1-5"

concurrency:
  group: job-searcher-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || '' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'qwen2.5:3b' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Start local Ollama model (optional)
        if: ${{ env.AI_PROVIDER == 'ollama' }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          ollama pull "$AI_MODEL"
      - name: Validate configuration
        run: job-searcher --config config.yml --check-config
      - name: Run job search
        run: job-searcher --config config.yml --output-dir reports
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-search-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
