name: Scheduled job scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1-5"

concurrency:
  group: job-searcher-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || '' }}
      AI_MODEL: ${{ vars.AI_MODEL || '' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install runtime dependencies
        run: python -m pip install .
      - name: Validate configuration
        run: job-searcher --config config.yml --check-config
      - name: Run job search
        run: job-searcher --config config.yml --output-dir reports
      - name: Upload reports (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-search-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
