name: Scheduled job scan
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1-5"
permissions:
  contents: read
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Validate configuration
        run: job-searcher --config config.yml --check-config
      - name: Scan public job boards
        run: job-searcher --config config.yml --output-dir reports
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-search-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
