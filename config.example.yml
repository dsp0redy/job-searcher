profile:
  titles: ["Software Engineer", "C++ Engineer", "Linux Systems Engineer", "Embedded Software Engineer", "Firmware Engineer", "Systems Software Engineer"]
  locations: ["Bengaluru", "Bangalore", "Hyderabad"]
  minimum_experience_years: 2
  maximum_experience_years: 5
  skills: ["C++", "Linux", "C", "Python", "Docker", "Podman", "gRPC", "embedded", "firmware"]
  # Titles containing any of these whole words are skipped as too senior.
  exclude_title_keywords: ["principal", "staff", "distinguished", "director", "vice president", "vp", "head of", "fellow"]
search:
  max_pages_per_source: 2
  request_timeout_seconds: 20
  max_concurrency: 4
  posted_within_days: 14
  report_retention_days: 30
  minimum_local_score: 2
  # Workday listings are unfiltered by default (newest postings worldwide). Search terms
  # narrow them server-side so relevant cities are not crowded out by max_pages_per_source.
  workday_search_terms: ["Bengaluru", "Hyderabad"]
  # Posting-detail requests per Workday site (descriptions drive skill/experience scoring).
  workday_detail_limit: 25
storage:
  path: "data/jobs.sqlite3"
  retention_days: 180
matching:
  provider: "gemini"
  threshold: 65
  max_jobs_per_ai_batch: 3
  max_ai_jobs_per_scan: 40
