[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-searcher"
version = "0.1.0"
description = "Modular job discovery and resume matching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "PyYAML>=6,<7", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.5,<1", "mypy>=1.10,<3", "hypothesis>=6,<7", "types-PyYAML>=6,<7"]

[project.scripts]
job-searcher = "job_searcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
branch = true
source = ["job_searcher"]

[tool.coverage.report]
show_missing = true
fail_under = 100
